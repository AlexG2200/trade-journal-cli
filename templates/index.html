<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Journal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <header class="page-header">
            <h1>Idea and Stock Journal</h1>
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
                <span class="theme-toggle__text">Dark</span>
            </button>
        </header>

        <div class="section">
            <h2>Weekly Trade Idea</h2>

            <form action="/weekly" method="POST">
                <label for="ticker">Ticker</label>
                <input type="text" id="ticker" name="ticker" placeholder="Example: TSLA" required>

                <label for="bias">Bias</label>
                <select id="bias" name="bias">
                    <option value="Bullish">Bullish</option>
                    <option value="Bearish">Bearish</option>
                    <option value="Neutral">Neutral</option>
                </select>

                <label for="idea">Trade Idea</label>
                <textarea id="idea" name="idea" rows="5" placeholder="Describe your trade idea..." required></textarea>

                <button type="submit">Save Weekly Idea</button>
            </form>
        </div>

        <div class="section">
            <h2>Aftermarket Scan</h2>

            <form action="/aftermarket" method="POST">
                <label for="after_ticker">Ticker</label>
                <input type="text" id="after_ticker" name="ticker" placeholder="Example: NVDA" required>

                <label for="catalyst">Catalyst</label>
                <input type="text" id="catalyst" name="catalyst" placeholder="News / earnings / none">

                <label for="levels">Key Levels</label>
                <input type="text" id="levels" name="levels" placeholder="Example: PMH 185.50, PML 180.20" required>

                <label for="plan">Plan for Tomorrow</label>
                <textarea id="plan" name="plan" rows="5" placeholder="Write your plan for tomorrow..." required></textarea>

                <button type="submit">Save Aftermarket Scan</button>
            </form>
        </div>
    </div>

    <script>
        const themeToggle = document.querySelector(".theme-toggle");
        const themeToggleText = document.querySelector(".theme-toggle__text");
        const savedTheme = localStorage.getItem("theme");
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)");

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;

            const isDark = theme === "dark";
            themeToggle.setAttribute("aria-pressed", isDark);
            themeToggleText.textContent = isDark ? "Light" : "Dark";
        }

        applyTheme(savedTheme || (systemPrefersDark.matches ? "dark" : "light"));

        themeToggle.addEventListener("click", () => {
            const currentTheme = document.documentElement.dataset.theme;
            const nextTheme = currentTheme === "dark" ? "light" : "dark";
            localStorage.setItem("theme", nextTheme);
            applyTheme(nextTheme);
        });

        systemPrefersDark.addEventListener("change", (event) => {
            if (!localStorage.getItem("theme")) {
                applyTheme(event.matches ? "dark" : "light");
            }
        });
    </script>
</body>
</html>
